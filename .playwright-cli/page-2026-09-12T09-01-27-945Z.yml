            - paragraph [ref=e88]: KOLSYSTEM Sp. z o.o. to niewielka, ekspercka firma inżynieryjna z Katowic. Specjalizujemy się w rozwoju, testowaniu i weryfikacji systemów, w których błąd nie jest opcją.
            - paragraph [ref=e89]: Łączymy doświadczenie zdobyte w wymagającym środowisku kolejowym z podejściem do bezpieczeństwa funkcjonalnego opartym na IEC 61508. Dzięki temu wspieramy projekty przemysłowe i realizacje w różnych branżach, w których bezpieczeństwo funkcji systemu musi być zaprojektowane, zweryfikowane i udokumentowane.
            - paragraph [ref=e90]: Pracujemy w środowisku MATLAB i Simulink, wykorzystując specjalistyczne toolboxy - w tym IEC Certification Kit - wspierające modelowanie, testowanie, analizę wymagań i przygotowanie materiałów dla procesu oceny zgodności.
